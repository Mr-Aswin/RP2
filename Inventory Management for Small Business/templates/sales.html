{% extends 'base.html' %}
{% block content %}
<div class="page-header">
  <h1>Sales Recording</h1>
</div>

<div class="grid-2">
  <section class="panel">
    <h2>Record Sale</h2>
    <form method="post">
      <label>Product</label>
      <select name="product_id" required>
        {% for product in products %}
          <option value="{{ product.id }}">{{ product.name }} (Stock: {{ product.stock_quantity }})</option>
        {% endfor %}
      </select>
      <label>Quantity</label>
      <input type="number" name="quantity" min="1" required />
      <button type="submit">Record Sale</button>
    </form>
  </section>

  <section class="panel">
    <h2>Sales History</h2>
    {% if sales %}
      <ul class="item-list">
        {% for sale in sales %}
          <li>
            <strong>{{ sale.product_name }}</strong>
            <span>{{ sale.quantity }} units | ${{ sale.revenue }}</span>
          </li>
        {% endfor %}
      </ul>
    {% else %}
      <p>No sales recorded yet.</p>
    {% endif %}
  </section>
</div>
{% endblock %}
